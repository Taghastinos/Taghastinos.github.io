description:You will never rise higher than the level of belief you hold about yourself. You are not where you want to be, not because you are incapable, not because you are unlucky, but because you haven’t yet forced yourself to believe it’s possible.
That’s the truth, that’s the root, that’s what’s been holding you back. And until you face this squarely, nothing changes. You stay where you are, stuck, spilling convincing yourself you’re moving tomorrow, but tomorrow never comes for the man who lacks belief. the world doesn’t hand belief like candy; it demands that you earn it.! And here’s a brutal part, you have to earn it before you see that you’re on the right track that’s why most never make it 

